<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5aac38">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>ひだまり牧場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#8b5a2b; --wood-d:#5e3a1a; --paper:#fdf4dc; --paper-2:#f3e2ba;
  --ink:#4a2f1a; --ink-soft:#7a5a3a; --leaf:#4f9a34; --honey:#f2b84b; --berry:#e0574a; --water:#3f8fc7;
  color-scheme: light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#1d2616;color:var(--ink);overflow:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.panel{background:linear-gradient(#fffaf0,#f4e3bc);border:3px solid var(--wood);border-radius:14px;
  box-shadow:0 3px 0 var(--wood-d),0 8px 16px rgba(0,0,0,.22)}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
#datePanel{padding:5px 12px 6px;min-width:112px}
#dateRow{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
#seasonPill{font:400 12px "Mochiy Pop One",sans-serif;padding:2px 8px;border-radius:10px;color:#fff}
#wIcon{width:20px;height:20px;display:block}
#clock{font:400 25px/1.1 "Mochiy Pop One",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#clock small{font-size:12px;margin-left:4px;color:var(--ink-soft)}
#rightCol{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#moneyPanel{padding:4px 12px 4px 8px;display:flex;align-items:center;gap:7px;font:400 17px "Mochiy Pop One",sans-serif;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#f2b84b 55%,#c98a1b);border:2px solid #a8700f;flex:none}
#stPanel{padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em}
#stBar{width:88px;height:10px;border-radius:6px;background:#e5d3a8;overflow:hidden;border:2px solid var(--wood)}
#stFill{height:100%;width:100%;background:linear-gradient(#ffc36b,#f07b2e);transition:width .3s}
#stFill.low{background:linear-gradient(#ff8a7a,#d8392b)}
#iconBtns{display:flex;gap:6px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;padding:0;position:relative;font:400 17px "Mochiy Pop One",sans-serif}
.ibtn canvas{width:30px;height:30px}
.ibtn.off{opacity:.55}

#toolbar{position:absolute;left:0;right:0;bottom:0;padding:0 6px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;justify-content:center;gap:6px;pointer-events:none}
.tool{pointer-events:auto;position:relative;width:62px;height:70px;border-radius:16px;border:3px solid var(--wood);
  background:linear-gradient(#fffaf0,#ecd6a8);box-shadow:0 4px 0 var(--wood-d),0 8px 14px rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 0 4px;
  font:800 11px "M PLUS Rounded 1c",sans-serif;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.tool canvas{width:40px;height:40px}
.tool.on{background:linear-gradient(#fff8d2,#ffcf5e);border-color:#b77a16;transform:translateY(-7px);
  box-shadow:0 4px 0 #9a6410,0 12px 18px rgba(0,0,0,.28)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--berry);color:#fff;border:2px solid #fff;border-radius:11px;
  font:800 11px/1 "M PLUS Rounded 1c",sans-serif;padding:3px 5px;min-width:12px;text-align:center;font-variant-numeric:tabular-nums}
.gauge{position:absolute;left:10px;right:10px;bottom:5px;height:4px;border-radius:2px;background:#d6c296;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--water);transition:width .2s}

#toasts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 104px);left:0;right:0;display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:rgba(58,36,18,.9);color:#fff8e6;padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;
  text-align:center;border:2px solid rgba(255,220,150,.35);animation:tIn .25s ease-out, tOut .4s ease-in 2.6s forwards}
@keyframes tIn{from{transform:translateY(-8px);opacity:0}}
@keyframes tOut{to{opacity:0;transform:translateY(-6px)}}

#modal{position:absolute;inset:0;z-index:20;background:rgba(30,20,8,.45);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:420px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--paper);
  border:4px solid var(--wood);border-radius:20px;box-shadow:0 6px 0 var(--wood-d),0 24px 48px rgba(0,0,0,.45);overflow:hidden;
  animation:pop .25s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h2{margin:0;font:400 19px "Mochiy Pop One",sans-serif;padding:12px 16px 10px;background:linear-gradient(#ecce94,#d9aa62);
  color:#47280e;border-bottom:3px solid var(--wood);text-wrap:balance}
.sheet .body{padding:14px 16px;overflow:auto;font-size:14px;line-height:1.65}
.sheet .btns{display:flex;gap:10px;padding:4px 16px 16px;justify-content:center;flex-wrap:wrap}
.btn{border:3px solid var(--wood);border-radius:14px;background:linear-gradient(#fffaf0,#ecd6a8);box-shadow:0 3px 0 var(--wood-d);
  padding:9px 18px;font-weight:800;font-size:14px;min-width:96px}
.btn.go{background:linear-gradient(#a6e07a,#5fae3b);color:#fff;border-color:#3d7a26;box-shadow:0 3px 0 #2b5a1a;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sec{font:400 13px "Mochiy Pop One",sans-serif;color:var(--ink-soft);margin:12px 0 6px;letter-spacing:.06em}
.sec:first-child{margin-top:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;background:#fffbf1;border:2px solid #e6cf9f}
.row canvas{width:44px;height:44px;flex:none;background:radial-gradient(#fff4d6,#f1ddb0);border-radius:10px}
.row .info{flex:1;min-width:0;line-height:1.35}
.row .nm{font-weight:800;font-size:14px}
.row .sub{font-size:11.5px;color:var(--ink-soft)}
.row .buy{display:flex;gap:5px;flex:none}
.row .buy .btn{min-width:0;padding:6px 9px;font-size:12px;border-width:2px;border-radius:10px}
.note{font-size:12px;color:var(--ink-soft);margin:8px 0 0}
.howto{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.howto b{color:#2f6e1f}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:2px dashed #d9bf8a;
  font:400 18px "Mochiy Pop One",sans-serif}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}

#fade{position:absolute;inset:0;z-index:10;background:#0b0d1a;opacity:0;pointer-events:none;transition:opacity .7s}
#fade.on{opacity:1}

#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,244,210,.0) 20%,rgba(20,30,10,.45) 100%)}
#logo{text-align:center;filter:drop-shadow(0 4px 0 #5e3a1a) drop-shadow(0 12px 18px rgba(0,0,0,.35))}
#logo h1{margin:0;font:400 clamp(40px,12vw,72px)/1.05 "Mochiy Pop One",sans-serif;color:#fff6d8;letter-spacing:.04em;
  -webkit-text-stroke:3px #7a4a1c;paint-order:stroke fill;text-wrap:balance}
#logo h1 span{color:#ffd35c}
#logo p{margin:6px 0 0;font:800 13px "M PLUS Rounded 1c",sans-serif;letter-spacing:.35em;color:#fff;text-shadow:0 2px 0 #7a4a1c}
#titleBtns{display:flex;flex-direction:column;gap:12px;width:min(260px,100%)}
#titleBtns .btn{font-size:17px;padding:12px}
#titleTip{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;max-width:300px}
@media (prefers-reduced-motion: reduce){.sheet,.toast{animation:none}}
</style>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div id="datePanel" class="panel">
      <div id="dateRow"><span id="seasonPill">春</span><span id="dateTxt">1日 (月)</span><span id="wIconWrap"></span></div>
      <div id="clock">6:00</div>
    </div>
    <div id="rightCol">
      <div id="moneyPanel" class="panel"><span class="coin"></span><span id="money">500</span><span style="font-size:13px">G</span></div>
      <div id="stPanel" class="panel">体力<div id="stBar"><div id="stFill"></div></div></div>
      <div id="iconBtns">
        <button class="ibtn panel" id="bagBtn" aria-label="バッグ"><canvas width="60" height="60"></canvas><span class="badge" id="bagBadge" hidden>0</span></button>
        <button class="ibtn panel" id="musicBtn" aria-label="音楽">♪</button>
        <button class="ibtn panel" id="helpBtn" aria-label="あそびかた">?</button>
      </div>
    </div>
  </div>
  <div id="toolbar" hidden>
    <button class="tool" data-tool="hoe"><canvas width="80" height="80"></canvas>クワ</button>
    <button class="tool" data-tool="water"><canvas width="80" height="80"></canvas>じょうろ<span class="gauge"><i id="canGauge"></i></span></button>
    <button class="tool" data-tool="seed"><canvas width="80" height="80"></canvas><span id="seedName">タネ</span><span class="badge" id="seedBadge">0</span></button>
    <button class="tool" data-tool="sickle"><canvas width="80" height="80"></canvas>カマ</button>
    <button class="tool" data-tool="hammer"><canvas width="80" height="80"></canvas>ハンマー</button>
  </div>
  <div id="toasts"></div>
  <div id="title">
    <div id="logo"><h1>ひだまり<span>牧場</span></h1><p>HIDAMARI FARM</p></div>
    <div id="titleBtns">
      <button class="btn go" id="btnNew">はじめから</button>
      <button class="btn" id="btnCont" hidden>つづきから</button>
    </div>
    <div id="titleTip">スマホでタップして遊べる、のんびり農場ぐらし</div>
  </div>
  <div id="modal" hidden><div class="sheet"><h2 id="mTitle"></h2><div class="body" id="mBody"></div><div class="btns" id="mBtns"></div></div></div>
  <div id="fade"></div>
</div>

<script>
(()=>{
'use strict';
/* ================= constants ================= */
const TS=64, MW=28, MH=22;
const SEASONS=['春','夏','秋','冬'], SEASON_COL=['#e77ea3','#3f9fd8','#d9772e','#7f9fc4'];
const SEASON_DAYS=15;
const WEEK=['月','火','水','木','金','土','日'];
const CROPS={
  turnip:     {name:'カブ',       season:0,days:4, price:20, sell:60, regrow:0,col:'#f1ecff'},
  potato:     {name:'ジャガイモ', season:0,days:6, price:50, sell:140,regrow:0,col:'#c8995a'},
  strawberry: {name:'イチゴ',     season:0,days:7, price:90, sell:50, regrow:3,col:'#e2394a'},
  tomato:     {name:'トマト',     season:1,days:8, price:70, sell:60, regrow:3,col:'#e64b3c'},
  corn:       {name:'トウモロコシ',season:1,days:10,price:120,sell:110,regrow:4,col:'#f3cf3f'},
  sweetpotato:{name:'サツマイモ', season:2,days:5, price:45, sell:115,regrow:0,col:'#b8426f'},
  eggplant:   {name:'ナス',       season:2,days:6, price:60, sell:45, regrow:3,col:'#6b3d8f'},
  pumpkin:    {name:'カボチャ',   season:2,days:9, price:110,sell:300,regrow:0,col:'#ee8a2b'},
};
const ITEMS=Object.assign({egg:{name:'たまご',sell:50},eggL:{name:'Lたまご',sell:100}},CROPS);
const CAN_LV=[20,40,80], CAN_PRICE=[1500,4000];
const CHICK_NAMES=['ピヨ','コッコ','タマ','ハナ','モモ','チャボ','ゴマ','キナコ'];
const COST={till:2,water:1,plant:1,cut:1,smash:3,untill:1,clearcrop:1,harvest:0,refill:0};
const KEY='hidamari-farm-v1';

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function circ(g,x,y,r,c){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2);g.fillStyle=c;g.fill();}
function ell(g,x,y,rx,ry,c,rot=0){g.beginPath();g.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot,0,Math.PI*2);g.fillStyle=c;g.fill();}
function line(g,x1,y1,x2,y2,c,w){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.stroke();}
function rgrad(g,x,y,r,stops){const gr=g.createRadialGradient(x-r*.35,y-r*.45,r*.1,x,y,r);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr;}
function leaf(g,x,y,len,w,ang,c1,c2){g.save();g.translate(x,y);g.rotate(ang);g.beginPath();g.moveTo(0,0);
  g.quadraticCurveTo(w,-len*.45,0,-len);g.quadraticCurveTo(-w,-len*.45,0,0);g.fillStyle=c1;g.fill();
  if(c2){g.strokeStyle=c2;g.lineWidth=1.2;g.beginPath();g.moveTo(0,-1);g.lineTo(0,-len*.8);g.stroke();}g.restore();}
function heart(g,x,y,s,c){g.save();g.translate(x,y);g.scale(s,s);g.beginPath();g.moveTo(0,3);g.bezierCurveTo(-7,-2,-4,-9,0,-5);
  g.bezierCurveTo(4,-9,7,-2,0,3);g.fillStyle=c;g.fill();g.restore();}
function star(g,x,y,r,c){g.save();g.translate(x,y);g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr2=i%2?r*.3:r;g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}g.closePath();g.fillStyle=c;g.fill();g.restore();}

/* ================= map ================= */
const idx=(x,y)=>x+y*MW;
const inB=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
const GT=new Uint8Array(MW*MH);   // 0 grass 1 path 2 water 3 field
const BLOCK=new Uint8Array(MW*MH);
const FIELD={x0:9,y0:8,x1:20,y1:16};
const SCARE={x:20,y:8};
const YARD={x0:2,y0:13,x1:5,y1:17};
const BUILD={house:{x:3,y:2,w:4,h:3},shop:{x:22,y:2,w:3,h:2},coop:{x:2,y:11,w:3,h:2},bin:{x:7,y:4,w:1,h:1}};
const DOOR={x:5,y:5};
const isFieldTile=(x,y)=>x>=FIELD.x0&&x<=FIELD.x1&&y>=FIELD.y0&&y<=FIELD.y1&&!(x===SCARE.x&&y===SCARE.y);
const isWater=(x,y)=>inB(x,y)&&GT[idx(x,y)]===2;
const statics=[], fences=new Set(), lamps=[], waterTiles=[], flowerBeds=[[3,5],[4,5],[6,5]];
function buildMap(){
  const R=rng(12345);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(x<2||y<2||x>=MW-2||y>=MH-2){BLOCK[idx(x,y)]=1;
      if(R()<.93)statics.push({k:R()<.42?'pine':'tree',v:R()<.5?0:1,x,y,jx:(R()-.5)*.5,jy:(R()-.5)*.3});}
  }
  for(let y=14;y<=19;y++)for(let x=21;x<=25;x++){
    const dx=(x+.5-23.8)/2,dy=(y+.5-17.4)/1.9;if(dx*dx+dy*dy<1){GT[idx(x,y)]=2;BLOCK[idx(x,y)]=1;waterTiles.push([x,y]);}
  }
  for(let y=FIELD.y0;y<=FIELD.y1;y++)for(let x=FIELD.x0;x<=FIELD.x1;x++)GT[idx(x,y)]=3;
  const P=[[5,5],[23,4],[23,5],[6,15],[8,12],[14,7],[15,7]];
  for(let x=3;x<=24;x++)P.push([x,6]);
  for(let y=7;y<=15;y++)P.push([7,y]);
  P.forEach(([x,y])=>GT[idx(x,y)]=1);
  const F=[];
  for(let x=8;x<=21;x++){F.push([x,7]);F.push([x,17]);}
  for(let y=8;y<=16;y++){F.push([8,y]);F.push([21,y]);}
  for(let y=12;y<=18;y++)if(y!==15)F.push([6,y]);
  for(let x=2;x<=5;x++)F.push([x,18]);
  F.push([5,12]);
  F.forEach(([x,y])=>{if((x===14||x===15)&&y===7)return;if(x===8&&y===12)return;fences.add(idx(x,y));BLOCK[idx(x,y)]=1;});
  for(const b of Object.values(BUILD))for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)BLOCK[idx(x,y)]=1;
  [[9,2],[19,2],[3,8],[25,9],[12,19],[20,19]].forEach(([x,y],i)=>{statics.push({k:'tree',v:i%2,x,y,jx:0,jy:0});BLOCK[idx(x,y)]=1;});
  [[13,3],[16,3],[4,9],[25,12],[9,19],[16,19],[4,19]].forEach(([x,y])=>{statics.push({k:'bush',x,y,jx:0,jy:0});BLOCK[idx(x,y)]=1;});
  [[10,5],[19,5],[6,10],[24,5]].forEach(([x,y])=>{lamps.push([x,y]);statics.push({k:'lamp',x,y});BLOCK[idx(x,y)]=1;});
  statics.push({k:'scare',x:SCARE.x,y:SCARE.y});BLOCK[idx(SCARE.x,SCARE.y)]=1;
}
buildMap();

/* ================= sprites ================= */
const SPR={};
const GRASS=[
  {base:'#7cc553',d:'#62ad3f',l:'#9ad86c',b1:'#4f9a34',b2:'#b0e37e'},
  {base:'#5aac38',d:'#46952b',l:'#74c24b',b1:'#377f24',b2:'#8bd05c'},
  {base:'#a7a04a',d:'#8d873a',l:'#c4b65a',b1:'#78752f',b2:'#d6c46e'},
  {base:'#e8eef6',d:'#d2dcea',l:'#fbfdff',b1:'#c2cfdf',b2:'#ffffff'},
];
function renderGround(se){
  const [c,g]=mk(MW*TS,MH*TS);const R=rng(99+se*7);const p=GRASS[se];
  g.fillStyle=p.base;g.fillRect(0,0,c.width,c.height);
  for(let i=0;i<700;i++){g.globalAlpha=.16+R()*.2;circ(g,R()*c.width,R()*c.height,15+R()*60,R()<.5?p.d:p.l);}
  g.globalAlpha=1;g.lineCap='round';
  for(let i=0;i<MW*MH*16;i++){const x=R()*c.width,y=R()*c.height;g.strokeStyle=R()<.5?p.b1:p.b2;g.globalAlpha=.5+R()*.4;
    g.lineWidth=1.5+R()*1.4;g.beginPath();g.moveTo(x,y);g.lineTo(x+(R()-.5)*6,y-5-R()*7);g.stroke();}
  g.globalAlpha=1;
  // forest floor
  g.fillStyle=se===3?'rgba(110,130,165,.22)':'rgba(20,50,20,.32)';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(x<2||y<2||x>=MW-2||y>=MH-2)g.fillRect(x*TS,y*TS,TS,TS);
  // field

const P={x:DOOR.x+.5,y:DOOR.y+.5,tx:DOOR.x,ty:DOOR.y,dir:'down',path:[],walk:0,act:null,blink:0};
let queue=[],cur=null;
function findPath(sx,sy,goal){
  if(goal(sx,sy))return [];
  const prev=new Int32Array(MW*MH).fill(-1);const q=[idx(sx,sy)];prev[q[0]]=q[0];
  for(let qi=0;qi<q.length;qi++){const i=q[qi],x=i%MW,y=(i/MW)|0;
    for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const nx=x+dx,ny=y+dy;if(!inB(nx,ny))continue;const ni=idx(nx,ny);
      if(prev[ni]!==-1||blocked(nx,ny))continue;prev[ni]=i;
      if(goal(nx,ny)){const path=[];let k=ni;while(k!==q[0]){path.unshift([k%MW,(k/MW)|0]);k=prev[k];}return path;}
      q.push(ni);}}
  return null;
}
function rectDist(x,y,r){const dx=Math.max(r.x-x,0,x-(r.x+r.w-1)),dy=Math.max(r.y-y,0,y-(r.y+r.h-1));return Math.max(dx,dy);}
function goalFor(t){
  if(t.type==='walk'){if(!blocked(t.x,t.y))return(x,y)=>x===t.x&&y===t.y;return(x,y)=>Math.abs(x-t.x)+Math.abs(y-t.y)===1;}
  if(t.type==='house')return(x,y)=>x===DOOR.x&&y===DOOR.y;
  if(t.type==='shop')return(x,y)=>y===4&&x>=22&&x<=24;
  let r;if(BUILD[t.type])r=BUILD[t.type];
  else if(t.type==='chicken')r={x:Math.floor(t.ref.x),y:Math.floor(t.ref.y),w:1,h:1};
  else r={x:t.x,y:t.y,w:1,h:1};
  return(x,y)=>rectDist(x,y,r)<=1;
}
function planPath(t){const p=findPath(P.tx,P.ty,goalFor(t));if(!p)return false;P.path=p;return true;}
function command(t){if(P.path.length)P.path=[P.path[0]];cur=null;queue=[t];}
function faceTo(x,y){const dx=x-P.tx,dy=y-P.ty;if(Math.abs(dx)>Math.abs(dy))P.dir=dx>0?'right':'left';else if(dy!==0)P.dir=dy>0?'down':'up';}

/* ================= actions ================= */
function getTileAction(x,y,tool){
  if(isWater(x,y))return tool==='water'?'refill':null;
  const c=cellAt(x,y);if(!c)return null;
  if(isRipe(c.crop))return 'harvest';
  switch(tool){
    case 'hoe':return(!c.til&&!c.obj)?'till':null;
    case 'water':return(c.til&&!c.wet)?'water':null;
    case 'seed':return(c.til&&!c.crop&&(S.seeds[S.seedSel]||0)>0)?'plant':null;
    case 'sickle':return c.obj==='weed'?'cut':(c.crop&&c.crop.dead)?'clearcrop':null;
    case 'hammer':return c.obj==='stone'?'smash':(c.til&&!c.crop)?'untill':null;
  }
  return null;
}
function hintFor(x,y){
  const c=cellAt(x,y);if(!c)return null;const tl=S.tool;
  if(c.obj==='stone'&&tl!=='hammer')return '石はハンマーでくだこう';
  if(c.obj==='weed'&&tl!=='sickle')return '雑草はカマで刈ろう';
  if(tl==='seed'){if(!(S.seeds[S.seedSel]>0))return 'タネがない！よろず屋で買おう';if(!c.til)return 'まずクワで耕そう';}
  if(tl==='water'&&!c.til)return '水やりは耕した土に';

}
function spend(k){const cost=COST[k]||0;if(S.stamina<cost){toast('へとへとで動けない…家で休もう');queue=[];return false;}S.stamina=Math.max(0,S.stamina-cost);return true;}
function perform(t){
  const wx=(t.x+.5)*TS,wy=(t.y+.5)*TS;

    if(!spend(k))return;

    switch(k){

      case 'water':S.can.lv--;c.wet=1;for(let i=0;i<12;i++)PT.push({x:wx+(Math.random()-.5)*30,y:wy-26,vx:(Math.random()-.5)*30,vy:40+Math.random()*60,g:300,life:0,max:.45,type:'drop',size:2.5,col:'#9fd4ff'});sfx('water');break;
      case 'plant':S.seeds[S.seedSel]--;c.crop={t:S.seedSel,g:0};sparkle(wx,wy,'#b7f08a',6);sfx('plant');
        if(CROPS[S.seedSel].season!==S.season){c.crop.dead=true;toast(`${CROPS[S.seedSel].name}は${SEASONS[S.season]}には育たない…`);}break;
      case 'cut':c.obj=null;leaves(wx,wy,'#5cb546',10);sfx('cut');break;
      case 'smash':c.obj=null;dust(wx,wy,'#9aa0a6',14);sfx('smash');break;
      case 'untill':c.til=0;c.wet=0;dust(wx,wy+10,'#8a5a36',6);sfx('till');break;

    faceTo(Math.floor(ch.x),Math.floor(ch.y));ch.freeze=1.2;const first=!ch.petted;ch.petted=true;

}

let AC=null,master=null,musicOn=true;const BGM={next:0,step:0};

function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);BGM.next=AC.currentTime+.2;}catch(e){AC=null;}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,type,vol,when,slide){if(!AC)return;const t0=when||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);}
let noiseBuf=null;
function noise(dur,vol,freq,type){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=AC.createGain();const t0=AC.currentTime;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+.05);}
function sfx(n){if(!AC)return;const t=AC.currentTime;
  switch(n){

    case 'water':noise(.35,.18,2400,'bandpass');tone(900,.08,'sine',.05,t+.05,1300);break;
    case 'plant':tone(520,.08,'sine',.18,t,780);break;
    case 'cut':noise(.1,.3,3000,'highpass');tone(700,.06,'triangle',.08,t,400);break;
    case 'smash':noise(.2,.6,900);tone(80,.2,'square',.12,t,40);break;
    case 'harvest':[72,76,79,84].forEach((m,i)=>tone(mf(m),.18,'triangle',.14,t+i*.06));break;
    case 'pickup':tone(mf(79),.1,'triangle',.14,t);tone(mf(84),.14,'triangle',.14,t+.07);break;
    case 'coin':tone(mf(88),.08,'square',.06,t);tone(mf(95),.3,'square',.06,t+.07);break;
    case 'cluck':tone(900,.07,'square',.05,t,600);tone(1000,.09,'square',.05,t+.1,650);break;
    case 'tap':tone(mf(84),.05,'sine',.06,t);break;
    case 'buy':tone(mf(76),.08,'triangle',.12,t);tone(mf(83),.16,'triangle',.12,t+.08);break;
    case 'step':noise(.04,.05,700);break;
  }}
const N=null;
const MEL=[4,N,7,N,9,7,4,N, 0,N,4,N,2,0,-3,N, 0,N,2,4,N,9,7,N, 7,N,N,4,2,N,N,N,
           4,N,7,N,12,N,9,7, 9,N,7,4,N,2,4,N, 9,N,7,N,4,N,2,0, 2,N,N,N,0,N,N,N];
const PROG=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];
function bgmTick(){
  if(!AC||!musicOn)return;const spb=60/84/2;
  if(BGM.next<AC.currentTime)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.4){
    const s=BGM.step,bar=Math.floor(s/8)%4,pos=s%8,ch=PROG[bar];const night=S&&(S.time>=1140);const v=night?.6:1;
    if(pos===0||pos===4)tone(mf(48+ch[0]),spb*3.6,'sine',.09*v,BGM.next);
    tone(mf(60+ch[[0,1,2,1][pos%4]]+(pos>=4?12:0)),spb*1.2,'triangle',.028*v,BGM.next);
    const m=MEL[s%MEL.length];if(m!==null)tone(mf(72+m),spb*1.9,'sine',.055*v,BGM.next);

    if(ch.peck>0)ch.peck-=dt;
    if(ch.freeze>0||night||paused&&!onTitle){ch.freeze-=dt;ch.moving=false;continue;}
    ch.timer-=dt;if(ch.timer<=0){if(Math.random()<.55){ch.tx=YARD.x0+.4+Math.random()*(YARD.x1-YARD.x0+.2);ch.ty=YARD.y0+.5+Math.random()*(YARD.y1-YARD.y0+.2);}else ch.peck=.6;ch.timer=1.5+Math.random()*3;}
    const dx=ch.tx-ch.x,dy=ch.ty-ch.y,d=Math.hypot(dx,dy);
    if(d>.05){const st=Math.min(d,1.3*dt);ch.x+=dx/d*st;ch.y+=dy/d*st;if(Math.abs(dx)>.02)ch.face=dx>0?1:-1;ch.moving=true;}else ch.moving=false;
  }
  if(onTitle||paused)return;
  // time
  S.time+=dt*1.6667;
  const hr=Math.floor(S.time/60);
  if(hr!==lastHour){lastHour=hr;if(hr===18)toast('日が暮れてきた。ニワトリたちはおやすみの時間');if(hr===24)toast('もう真夜中…そろそろ寝よう');}
  if(S.time>=1560){passOut();return;}
  // player
  if(P.act){P.act.t+=dt;if(P.act.t>=P.act.dur)P.act=null;}
  else if(P.path.length){const [nx,ny]=P.path[0];const gx=nx+.5,gy=ny+.5;const dx=gx-P.x,dy=gy-P.y,d=Math.hypot(dx,dy);const sp=4.2*dt;
    if(Math.abs(dx)>Math.abs(dy))P.dir=dx>0?'right':'left';else if(Math.abs(dy)>.01)P.dir=dy>0?'down':'up';
    if(d<=sp){P.x=gx;P.y=gy;P.tx=nx;P.ty=ny;P.path.shift();P.walk+=d;}else{P.x+=dx/d*sp;P.y+=dy/d*sp;P.walk+=sp;}
    if(Math.floor(P.walk)!==Math.floor(P.walk-sp))sfx('step');}
  else if(cur){const t2=cur;cur=null;if(goalFor(t2)(P.tx,P.ty))perform(t2);else if((t2.tries=(t2.tries||0)+1)<3){cur=t2;if(!planPath(t2))cur=null;}}
  else if(queue.length){cur=queue.shift();if(!planPath(cur)){if(cur.type!=='tile')toast('そこには行けないみたい');cur=null;}}
}
function ambient(dt,t){
  const se=S.season,day=S.time<1140&&S.time>=390,vwW=cv.width/zoom,vhW=cv.height/zoom;
  if(S.weather==='sun'&&day&&se<2&&BF.length<4&&Math.random()<dt*.5){BF.push({x:camX+Math.random()*vwW,y:camY+Math.random()*vhW,vx:0,vy:0,t:0,life:12+Math.random()*10,col:['#ffe066','#ffffff','#ff9ec4','#9fd4ff'][Math.floor(Math.random()*4)]});}
  for(let i=BF.length-1;i>=0;i--){const b=BF[i];b.t+=dt;b.vx+=(Math.random()-.5)*300*dt;b.vy+=(Math.random()-.5)*300*dt;b.vx*=.97;b.vy*=.97;b.x+=b.vx*dt;b.y+=b.vy*dt+Math.sin(b.t*5)*.3;
    if(b.t>b.life||(!day&&Math.random()<dt))BF.splice(i,1);}
  if(se===1&&!day&&S.weather==='sun'&&FF.length<14&&Math.random()<dt*3)FF.push({x:camX+Math.random()*vwW,y:camY+Math.random()*vhW,t:Math.random()*6,life:8});
  for(let i=FF.length-1;i>=0;i--){const f=FF[i];f.t+=dt;f.x+=Math.sin(f.t*.7)*12*dt;f.y+=Math.cos(f.t*.9)*10*dt;if(f.t>f.life||day)FF.splice(i,1);}
  if((se===0||se===2)&&S.weather==='sun'&&Math.random()<dt*(se===0?5:3)){
    PT.push({x:camX+Math.random()*vwW*1.2,y:camY-10,vx:-30-Math.random()*30,vy:30+Math.random()*25,g:0,life:0,max:9,type:'petal',size:se===0?4:5,
      col:se===0?(Math.random()<.5?'#ffc4d6':'#ffe0ea'):['#e0762e','#c9472b','#f2b84b'][Math.floor(Math.random()*3)],rot:Math.random()*6,vr:(Math.random()-.5)*4});}
  if((S.time<540||S.time>1020||se===3)&&Math.random()<dt*3){const x=HOUSE_O.x+213,y=HOUSE_O.y+14;PT.push({x:x+(Math.random()-.5)*6,y,vx:8+Math.random()*10,vy:-18-Math.random()*10,g:-4,life:0,max:3,type:'smoke',size:6,col:'#e8e4ea'});}
}

/* ================= day cycle ================= */
function rollWeather(se){const r=Math.random();if(se===3)return r<.35?'snow':'sun';return r<[.22,.18,.2][se]?'rain':'sun';}
function endDay(passed){
  const earned=S.binTotal,lines=Object.entries(S.bin).map(([k,n])=>({k,n,v:n*ITEMS[k].sell}));
  S.money+=earned;S.bin={};S.binTotal=0;
  for(let y=FIELD.y0;y<=FIELD.y1;y++)for(let x=FIELD.x0;x<=FIELD.x1;x++){const c=S.field[idx(x,y)];if(!c)continue;
    if(c.crop&&!c.crop.dead){if(c.wet)c.crop.g=Math.min(c.crop.g+1,CROPS[c.crop.t].days);}
    else if(!c.crop){if(c.til&&Math.random()<.04)c.til=0;else if(!c.til&&!c.obj&&Math.random()<.02)c.obj='weed';}
    c.wet=0;}
  // eggs
  S.eggs=[];const spots=[];for(let y=YARD.y0;y<=YARD.y1;y++)for(let x=YARD.x0;x<=YARD.x1;x++)spots.push([x,y]);
  for(const ch of S.chickens){if(!spots.length)break;const [x,y]=spots.splice(Math.floor(Math.random()*spots.length),1)[0];S.eggs.push({x,y,big:ch.petted});if(ch.petted)ch.love++;ch.petted=false;
    ch.x=YARD.x0+.5+Math.random()*3;ch.y=YARD.y0+.5+Math.random()*4;ch.tx=ch.x;ch.ty=ch.y;}
  // date
  S.total++;S.day++;let seasonChanged=false;
  if(S.day>SEASON_DAYS){S.day=1;S.season=(S.season+1)%4;if(S.season===0)S.year++;seasonChanged=true;
    for(const c of S.field)if(c&&c.crop&&CROPS[c.crop.t].season!==S.season)c.crop.dead=true;}
  S.weather=S.tomorrow;if(S.season===3&&S.weather==='rain')S.weather='snow';if(S.season!==3&&S.weather==='snow')S.weather='rain';
  S.tomorrow=rollWeather(S.season);
  if(S.weather==='rain')for(const c of S.field)if(c&&c.til)c.wet=1;
  S.time=360;S.stamina=passed?Math.round(S.maxSt/2):S.maxSt;
  P.x=DOOR.x+.5;P.y=DOOR.y+.5;P.tx=DOOR.x;P.ty=DOOR.y;P.dir='down';P.path=[];P.act=null;queue=[];cur=null;lastHour=-1;
  if(seasonChanged||SPR.se!==S.season)buildSprites(S.season);
  save();
  return{earned,lines,passed,seasonChanged};
}

function pickTarget(w){
  const tx=Math.floor(w.x/TS),ty=Math.floor(w.y/TS);
  for(const ch of S.chickens)if(Math.hypot(w.x-ch.x*TS,w.y-(ch.y*TS-14))<30)return{type:'chicken',ref:ch};
  for(const e of S.eggs)if(e.x===tx&&e.y===ty)return{type:'egg',ref:e,x:tx,y:ty};
  const inR=(x0,y0,x1,y1)=>w.x>=x0*TS&&w.x<x1*TS&&w.y>=y0*TS&&w.y<y1*TS;
  if(inR(3,.6,7,5))return{type:'house'};
  if(inR(22,.4,25,4))return{type:'shop'};
  if(inR(7,3.7,8,5))return{type:'bin'};
  if(inR(2,9.8,5,13))return{type:'coop'};
  if(!inB(tx,ty))return null;
  const k=getTileAction(tx,ty,S.tool);
  if(k)return{type:'tile',x:tx,y:ty,kind:k};
  const h=hintFor(tx,ty);if(h)toast(h);
  if(isWater(tx,ty))toast('じょうろを選ぶと水をくめるよ');
  return{type:'walk',x:tx,y:ty};
}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(paused||onTitle)return;e.preventDefault();
  const w=toWorld(e);const t=pickTarget(w);if(!t)return;
  tapFx={x:w.x,y:w.y,t:0};sfx('tap');
  const tx=Math.floor(w.x/TS),ty=Math.floor(w.y/TS);
  drag={id:e.pointerId,kind:t.type==='tile'?t.kind:null,seen:new Set([tx+','+ty])};
  command(t);try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId||!drag.kind||paused)return;
  const w=toWorld(e);const tx=Math.floor(w.x/TS),ty=Math.floor(w.y/TS);const key=tx+','+ty;if(drag.seen.has(key))return;drag.seen.add(key);
  const k=getTileAction(tx,ty,S.tool);
  if(k&&k===drag.kind){queue.push({type:'tile',x:tx,y:ty,kind:k});}
});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!onTitle)save();});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= boot ================= */
function startGame(state,isNew){
  S=state;onTitle=false;
  P.x=S.px+.5;P.y=S.py+.5;P.tx=S.px;P.ty=S.py;P.path=[];P.dir='down';
  if(SPR.se!==S.season)buildSprites(S.season);
  $('#title').hidden=true;$('#hud').hidden=false;$('#toolbar').hidden=false;
  hudCache.music=null;refreshIcons();paused=false;
  if(isNew){save();openHelp(true);}
  else toast(`${SEASONS[S.season]} ${S.day}日 ${wLabel(S.weather)}。おかえりなさい！`);
}
const saved=loadSave();
if(saved&&saved.field&&saved.field.length===MW*MH)$('#btnCont').hidden=false;
let confirmNew=false;
$('#btnNew').onclick=()=>{initAudio();
  if(saved&&!confirmNew){confirmNew=true;$('#btnNew').textContent='データを消してはじめる';$('#titleTip').textContent='もう一度押すと、今のセーブデータは消えます';return;}
  sfx('harvest');startGame(newState(),true);};
$('#btnCont').onclick=()=>{initAudio();sfx('harvest');startGame(saved,false);};

S=saved&&saved.field&&saved.field.length===MW*MH?saved:newState();
buildSprites(S.season);resize();
camX=14.5*TS-cv.width/zoom/2;camY=10*TS-cv.height/zoom/2;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;gameT+=dt;
  update(dt,gameT);render(gameT,dt);if(!onTitle)updateHUD();bgmTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// fonts finished loading: redraw sprites that contain text
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>buildSprites(S.season));
})();
</script>
