<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5aac38">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>ひだまり牧場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#8b5a2b; --wood-d:#5e3a1a; --paper:#fdf4dc; --paper-2:#f3e2ba;
  --ink:#4a2f1a; --ink-soft:#7a5a3a; --leaf:#4f9a34; --honey:#f2b84b; --berry:#e0574a; --water:#3f8fc7;
  color-scheme: light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#1d2616;color:var(--ink);overflow:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.panel{background:linear-gradient(#fffaf0,#f4e3bc);border:3px solid var(--wood);border-radius:14px;
  box-shadow:0 3px 0 var(--wood-d),0 8px 16px rgba(0,0,0,.22)}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
#datePanel{padding:5px 12px 6px;min-width:112px}
#dateRow{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
#seasonPill{font:400 12px "Mochiy Pop One",sans-serif;padding:2px 8px;border-radius:10px;color:#fff}
#wIcon{width:20px;height:20px;display:block}
#clock{font:400 25px/1.1 "Mochiy Pop One",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#clock small{font-size:12px;margin-left:4px;color:var(--ink-soft)}
#rightCol{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#moneyPanel{padding:4px 12px 4px 8px;display:flex;align-items:center;gap:7px;font:400 17px "Mochiy Pop One",sans-serif;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#f2b84b 55%,#c98a1b);border:2px solid #a8700f;flex:none}
#stPanel{padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em}
#stBar{width:88px;height:10px;border-radius:6px;background:#e5d3a8;overflow:hidden;border:2px solid var(--wood)}
#stFill{height:100%;width:100%;background:linear-gradient(#ffc36b,#f07b2e);transition:width .3s}
#stFill.low{background:linear-gradient(#ff8a7a,#d8392b)}
#iconBtns{display:flex;gap:5px}
.ibtn{width:37px;height:37px;display:grid;place-items:center;padding:0;position:relative;font:400 17px "Mochiy Pop One",sans-serif}
.ibtn canvas{width:28px;height:28px}
.ibtn.off{opacity:.55}

#toolbar{position:absolute;left:0;right:0;bottom:0;padding:0 6px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;justify-content:center;gap:4px;pointer-events:none}
.tool{pointer-events:auto;position:relative;flex:1 1 0;min-width:0;max-width:62px;height:62px;border-radius:13px;border:3px solid var(--wood);letter-spacing:-.06em;overflow:visible;white-space:nowrap;
  background:linear-gradient(#fffaf0,#ecd6a8);box-shadow:0 4px 0 var(--wood-d),0 8px 14px rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 0 4px;
  font:800 9px "M PLUS Rounded 1c",sans-serif;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.tool canvas{width:32px;height:32px}
@media (min-width:420px){.tool{font-size:10px;height:66px}.tool canvas{width:36px;height:36px}}
@media (min-width:560px){.tool{font-size:11px;height:70px;letter-spacing:0}.tool canvas{width:40px;height:40px}}
.tool.on{background:linear-gradient(#fff8d2,#ffcf5e);border-color:#b77a16;transform:translateY(-7px);
  box-shadow:0 4px 0 #9a6410,0 12px 18px rgba(0,0,0,.28)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--berry);color:#fff;border:2px solid #fff;border-radius:11px;
  font:800 11px/1 "M PLUS Rounded 1c",sans-serif;padding:3px 5px;min-width:12px;text-align:center;font-variant-numeric:tabular-nums}
.gauge{position:absolute;left:10px;right:10px;bottom:5px;height:4px;border-radius:2px;background:#d6c296;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--water);transition:width .2s}

#toasts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 104px);left:0;right:0;display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:rgba(58,36,18,.9);color:#fff8e6;padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;
  text-align:center;border:2px solid rgba(255,220,150,.35);animation:tIn .25s ease-out, tOut .4s ease-in 2.6s forwards}
@keyframes tIn{from{transform:translateY(-8px);opacity:0}}
@keyframes tOut{to{opacity:0;transform:translateY(-6px)}}

#modal{position:absolute;inset:0;z-index:20;background:rgba(30,20,8,.45);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:420px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--paper);
  border:4px solid var(--wood);border-radius:20px;box-shadow:0 6px 0 var(--wood-d),0 24px 48px rgba(0,0,0,.45);overflow:hidden;
  animation:pop .25s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h2{margin:0;font:400 19px "Mochiy Pop One",sans-serif;padding:12px 16px 10px;background:linear-gradient(#ecce94,#d9aa62);
  color:#47280e;border-bottom:3px solid var(--wood);text-wrap:balance}
.sheet .body{padding:14px 16px;overflow:auto;font-size:14px;line-height:1.65}
.sheet .btns{display:flex;gap:10px;padding:4px 16px 16px;justify-content:center;flex-wrap:wrap}
.btn{border:3px solid var(--wood);border-radius:14px;background:linear-gradient(#fffaf0,#ecd6a8);box-shadow:0 3px 0 var(--wood-d);
  padding:9px 18px;font-weight:800;font-size:14px;min-width:96px}
.btn.go{background:linear-gradient(#a6e07a,#5fae3b);color:#fff;border-color:#3d7a26;box-shadow:0 3px 0 #2b5a1a;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sec{font:400 13px "Mochiy Pop One",sans-serif;color:var(--ink-soft);margin:12px 0 6px;letter-spacing:.06em}
.sec:first-child{margin-top:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;background:#fffbf1;border:2px solid #e6cf9f}
.row canvas{width:44px;height:44px;flex:none;background:radial-gradient(#fff4d6,#f1ddb0);border-radius:10px}
.row .info{flex:1;min-width:0;line-height:1.35}
.row .nm{font-weight:800;font-size:14px}
.row .sub{font-size:11.5px;color:var(--ink-soft)}
.row .buy{display:flex;gap:5px;flex:none}
.row .buy .btn{min-width:0;padding:6px 9px;font-size:12px;border-width:2px;border-radius:10px}
.note{font-size:12px;color:var(--ink-soft);margin:8px 0 0}
.howto{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.howto b{color:#2f6e1f}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:2px dashed #d9bf8a;
  font:400 18px "Mochiy Pop One",sans-serif}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}

#talk{position:absolute;left:0;right:0;bottom:0;z-index:15;padding:40px 10px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(rgba(30,20,8,0),rgba(30,20,8,.35) 40%);cursor:pointer}
.tbox{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--paper);
  border:4px solid var(--wood);border-radius:18px;box-shadow:0 5px 0 var(--wood-d),0 16px 32px rgba(0,0,0,.35);animation:pop .2s ease-out}
#tPortrait{width:76px;height:76px;flex:none;border-radius:14px;border:3px solid #d9bf8a}
.tmain{flex:1;min-width:0;position:relative}
#tName{font:400 15px "Mochiy Pop One",sans-serif;color:#7a4a1c;margin-bottom:4px}
#tName .hearts{color:#e0577a;font-size:12px;letter-spacing:.05em}
#tText{font-size:15px;line-height:1.65;min-height:3.3em;font-weight:700}
#tChoices{display:flex;flex-direction:column;gap:7px;margin-top:8px}
#tChoices .btn{width:100%;text-align:left;padding:9px 14px}
#tNext{position:absolute;right:2px;bottom:-4px;color:var(--wood);animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
.srow{flex-wrap:wrap}
.pricebar{display:flex;align-items:center;gap:5px;width:100%;flex-wrap:wrap;justify-content:flex-end}
.btn.sm{min-width:0;padding:5px 9px;font-size:13px;border-width:2px;border-radius:10px;box-shadow:0 2px 0 var(--wood-d)}
.btn.sm.auto{background:linear-gradient(#e6f5ff,#b8dcf5);border-color:#3f7fbf;box-shadow:0 2px 0 #2f5f8f}
.price{width:68px;padding:5px 6px;font:800 15px "M PLUS Rounded 1c",sans-serif;text-align:right;border:2px solid var(--wood);border-radius:9px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.pricebar .g{font-weight:800;margin-left:-2px}
#fade{position:absolute;inset:0;z-index:10;background:#0b0d1a;opacity:0;pointer-events:none;transition:opacity .7s}
#fade.on{opacity:1}

#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,244,210,.0) 20%,rgba(20,30,10,.45) 100%)}
#logo{text-align:center;filter:drop-shadow(0 4px 0 #5e3a1a) drop-shadow(0 12px 18px rgba(0,0,0,.35))}
#logo h1{margin:0;font:400 clamp(40px,12vw,72px)/1.05 "Mochiy Pop One",sans-serif;color:#fff6d8;letter-spacing:.04em;
  -webkit-text-stroke:3px #7a4a1c;paint-order:stroke fill;text-wrap:balance}
#logo h1 span{color:#ffd35c}
#logo p{margin:6px 0 0;font:800 13px "M PLUS Rounded 1c",sans-serif;letter-spacing:.35em;color:#fff;text-shadow:0 2px 0 #7a4a1c}
#titleBtns{display:flex;flex-direction:column;gap:12px;width:min(260px,100%)}
#titleBtns .btn{font-size:17px;padding:12px}
#titleTip{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;max-width:300px}
@media (prefers-reduced-motion: reduce){.sheet,.toast{animation:none}}
</style>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div id="datePanel" class="panel">
      <div id="dateRow"><span id="seasonPill">春</span><span id="dateTxt">1日 (月)</span><span id="wIconWrap"></span></div>
      <div id="clock">6:00</div>
    </div>
    <div id="rightCol">
      <div id="moneyPanel" class="panel"><span class="coin"></span><span id="money">500</span><span style="font-size:13px">G</span></div>
      <div id="stPanel" class="panel">体力<div id="stBar"><div id="stFill"></div></div></div>
      <div id="iconBtns">
        <button class="ibtn panel" id="centerBtn" aria-label="キャラクターの場所を表示"><canvas width="60" height="60"></canvas></button>
        <button class="ibtn panel" id="questBtn" aria-label="おねがい帳"><canvas width="60" height="60"></canvas><span class="badge" id="questBadge" hidden>!</span></button>
        <button class="ibtn panel" id="bagBtn" aria-label="バッグ"><canvas width="60" height="60"></canvas><span class="badge" id="bagBadge" hidden>0</span></button>
        <button class="ibtn panel" id="musicBtn" aria-label="音楽">♪</button>
        <button class="ibtn panel" id="helpBtn" aria-label="あそびかた">?</button>
      </div>
    </div>
  </div>
  <div id="toolbar" hidden>
    <button class="tool" data-tool="hand"><canvas width="80" height="80"></canvas>手ぶら</button>
    <button class="tool" data-tool="hoe"><canvas width="80" height="80"></canvas>クワ</button>
    <button class="tool" data-tool="water"><canvas width="80" height="80"></canvas>じょうろ<span class="gauge"><i id="canGauge"></i></span></button>
    <button class="tool" data-tool="seed"><canvas width="80" height="80"></canvas><span id="seedName">タネ</span><span class="badge" id="seedBadge">0</span></button>
    <button class="tool" data-tool="sickle"><canvas width="80" height="80"></canvas>カマ</button>
    <button class="tool" data-tool="hammer"><canvas width="80" height="80"></canvas>ハンマー</button>
    <button class="tool" data-tool="milker"><canvas width="80" height="80"></canvas>ミルカー</button>
    <button class="tool" data-tool="rod"><canvas width="80" height="80"></canvas>つりざお</button>
  </div>
  <div id="toasts"></div>
  <div id="title">
    <div id="logo"><h1>ひだまり<span>牧場</span></h1><p>HIDAMARI FARM</p></div>
    <div id="titleBtns">
      <button class="btn go" id="btnNew">はじめから</button>
      <button class="btn" id="btnCont" hidden>つづきから</button>
    </div>
    <div id="titleTip">スマホでタップして遊べる、のんびり農場ぐらし</div>
  </div>
  <div id="talk" hidden><div class="tbox"><canvas id="tPortrait" width="192" height="192"></canvas><div class="tmain"><div id="tName"></div><div id="tText"></div><div id="tChoices"></div><div id="tNext" hidden>▼</div></div></div></div>
  <div id="modal" hidden><div class="sheet"><h2 id="mTitle"></h2><div class="body" id="mBody"></div><div class="btns" id="mBtns"></div></div></div>
  <div id="fade"></div>
</div>

<script>
(()=>{
'use strict';
/* ================= constants ================= */
const TS=64, MW=34, MH=22;
const SEASONS=['春','夏','秋','冬'], SEASON_COL=['#e77ea3','#3f9fd8','#d9772e','#7f9fc4'];
const SEASON_DAYS=15;
const WEEK=['月','火','水','木','金','土','日'];
const CROPS={
  turnip:     {name:'カブ',       season:0,days:4, price:20, sell:60, regrow:0,col:'#f1ecff'},
  potato:     {name:'ジャガイモ', season:0,days:6, price:50, sell:140,regrow:0,col:'#c8995a'},
  strawberry: {name:'イチゴ',     season:0,days:7, price:90, sell:50, regrow:3,col:'#e2394a'},
  carrot:     {name:'ニンジン',   season:0,days:5, price:40, sell:110,regrow:0,col:'#f08a2b'},
  cabbage:    {name:'キャベツ',   season:0,days:8, price:100,sell:260,regrow:0,col:'#a8d878'},
  tomato:     {name:'トマト',     season:1,days:8, price:70, sell:60, regrow:3,col:'#e64b3c'},
  pepper:     {name:'ピーマン',   season:1,days:6, price:50, sell:40, regrow:2,col:'#2f9a32'},
  corn:       {name:'トウモロコシ',season:1,days:10,price:120,sell:110,regrow:4,col:'#f3cf3f'},
  watermelon: {name:'スイカ',     season:1,days:11,price:150,sell:420,regrow:0,col:'#2f7a2c'},
  sweetpotato:{name:'サツマイモ', season:2,days:5, price:45, sell:115,regrow:0,col:'#b8426f'},
  radish:     {name:'ダイコン',   season:2,days:6, price:50, sell:140,regrow:0,col:'#f4f4ea'},
  eggplant:   {name:'ナス',       season:2,days:6, price:60, sell:45, regrow:3,col:'#6b3d8f'},
  pumpkin:    {name:'カボチャ',   season:2,days:9, price:110,sell:300,regrow:0,col:'#ee8a2b'},
  spinach:    {name:'ホウレンソウ',season:3,days:5,price:60, sell:130,regrow:0,col:'#2f7f2a'},
  hakusai:    {name:'ハクサイ',   season:3,days:8, price:90, sell:250,regrow:0,col:'#dff0c0'},
};
// se: seasons the fish bites in; night: only after 18:00
const FISH={
  medaka:  {name:'メダカ',  sell:20, w:5,se:[0,1,2],  col:'#c9b88a',belly:'#efe6c8',len:.6},
  funa:    {name:'フナ',    sell:45, w:6,se:[0,1,2,3],col:'#8a7a4a',belly:'#d8cfa0',len:.85},
  nijimasu:{name:'ニジマス',sell:95, w:3,se:[0,2],    col:'#7a8f7a',belly:'#f4b8c0',len:.95},
  ayu:     {name:'アユ',    sell:110,w:3,se:[1],      col:'#8fa06a',belly:'#f2e9b0',len:.9},
  wakasagi:{name:'ワカサギ',sell:70, w:6,se:[3],      col:'#a8b8c8',belly:'#eef3f8',len:.7},
  koi:     {name:'コイ',    sell:160,w:1,se:[0,1,2],  col:'#e2663a',belly:'#fff1dc',len:1.1},
  namazu:  {name:'ナマズ',  sell:210,w:2,se:[0,1,2],  col:'#4a4a3a',belly:'#bdb59a',len:1.15,night:true},
};
// need: ingredient keys; milk / egg / fish accept any size or kind
const DISHES={
  hotmilk:    {name:'ホットミルク',   need:{milk:1},                   st:30,sell:170,v:'cup',  c:['#fbf6ec','#f2e2c0']},
  asazuke:    {name:'カブの浅漬け',   need:{turnip:2},                 st:25,sell:160,v:'plate',c:['#f3eef8','#8fd66a']},
  jagabata:   {name:'じゃがバター',   need:{potato:1,milk:1},          st:50,sell:360,v:'plate',c:['#e8c27a','#ffe27a']},
  yakiimo:    {name:'焼きいも',       need:{sweetpotato:1},            st:40,sell:220,v:'plate',c:['#9a2f5c','#f6c85a']},
  omelet:     {name:'オムレツ',       need:{egg:1,milk:1},             st:45,sell:280,v:'plate',c:['#ffd24a','#e0402a']},
  strawmilk:  {name:'いちごミルク',   need:{strawberry:2,milk:1},      st:50,sell:320,v:'cup',  c:['#ffc0d0','#e2394a']},
  carrotcake: {name:'にんじんケーキ', need:{carrot:1,egg:1,milk:1},    st:60,sell:450,v:'cake', c:['#e8a25a','#fff6ea']},
  rollcabbage:{name:'ロールキャベツ', need:{cabbage:1,egg:1},          st:55,sell:420,v:'bowl', c:['#c8e89a','#e0664a']},
  natsusalad: {name:'夏野菜サラダ',   need:{tomato:1,pepper:1},        st:40,sell:220,v:'bowl', c:['#8fd66a','#e64b3c']},
  yakitoumo:  {name:'焼きとうもろこし',need:{corn:1},                  st:30,sell:190,v:'corn', c:['#f3cf3f','#9a6a2a']},
  suikajuice: {name:'スイカジュース', need:{watermelon:1},             st:45,sell:500,v:'cup',  c:['#ff6b6b','#2f7a2c']},
  yakinasu:   {name:'焼きナス',       need:{eggplant:2},               st:30,sell:150,v:'plate',c:['#6b3d8f','#c9a86a']},
  furofuki:   {name:'ふろふき大根',   need:{radish:1},                 st:35,sell:220,v:'bowl', c:['#f4efe0','#b8733a']},
  pumpkinpie: {name:'かぼちゃパイ',   need:{pumpkin:1,egg:1,milk:1},   st:80,sell:750,v:'pie',  c:['#ee8a2b','#d9a066']},
  yakizakana: {name:'焼き魚',         need:{fish:1},                   st:40,sell:200,v:'fish', c:['#b98755','#f2f2e8']},
  ohitashi:   {name:'おひたし',       need:{spinach:2},                st:35,sell:300,v:'bowl', c:['#2f7f2a','#f2e2b0']},
  hakusainabe:{name:'白菜なべ',       need:{hakusai:1,spinach:1,fish:1},st:90,sell:700,v:'pot', c:['#f4f7e8','#2f7f2a']},
};
const ITEMS=Object.assign({egg:{name:'たまご',sell:50},eggL:{name:'Lたまご',sell:100},
  milkS:{name:'ミルク(S)',sell:100},milkM:{name:'ミルク(M)',sell:150},milkL:{name:'ミルク(L)',sell:220}},CROPS,FISH,DISHES);
const GROUP={milk:['milkS','milkM','milkL'],egg:['egg','eggL'],fish:Object.keys(FISH).sort((a,b)=>FISH[a].sell-FISH[b].sell)};
const GROUP_NAME={milk:'ミルク',egg:'たまご',fish:'魚'};
const COW_NAMES=['ハナコ','ミルキー','モモコ','ベル','クルミ','マシュ'];
const COW_MAX=4, COW_PRICE=3000;

function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

const statics=[], fences=new Set(), lamps=[], waterTiles=[], flowerBeds=[[3,5],[4,5],[6,5]];
function buildMap(){
  const R=rng(12345);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(x<2||y<2||x>=MW-2||y>=MH-2){BLOCK[idx(x,y)]=1;
      if(R()<.93)statics.push({k:R()<.42?'pine':'tree',v:R()<.5?0:1,x,y,jx:(R()-.5)*.5,jy:(R()-.5)*.3});}
  }
  for(let y=14;y<=19;y++)for(let x=21;x<=25;x++){
    const dx=(x+.5-23.8)/2,dy=(y+.5-17.4)/1.9;if(dx*dx+dy*dy<1){GT[idx(x,y)]=2;BLOCK[idx(x,y)]=1;waterTiles.push([x,y]);}
  }
  for(let y=FIELD.y0;y<=FIELD.y1;y++)for(let x=FIELD.x0;x<=FIELD.x1;x++)GT[idx(x,y)]=3;
  const P=[[5,5],[23,4],[23,5],[6,15],[8,12],[14,7],[15,7]];
  for(let x=3;x<=30;x++)P.push([x,6]);
  P.push([28,7]);
  for(let y=7;y<=15;y++)P.push([7,y]);
  P.forEach(([x,y])=>GT[idx(x,y)]=1);
  const F=[];
  for(let x=8;x<=21;x++){F.push([x,7]);F.push([x,17]);}
  for(let y=8;y<=16;y++){F.push([8,y]);F.push([21,y]);}
  for(let y=12;y<=18;y++)if(y!==15)F.push([6,y]);
  for(let x=2;x<=5;x++)F.push([x,18]);
  F.push([5,12]);
  for(let x=26;x<=31;x++){if(x!==28)F.push([x,7]);F.push([x,14]);}
  for(let y=8;y<=13;y++)F.push([26,y]);
  F.forEach(([x,y])=>{if((x===14||x===15)&&y===7)return;if(x===8&&y===12)return;fences.add(idx(x,y));BLOCK[idx(x,y)]=1;});
  for(const b of Object.values(BUILD))for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)BLOCK[idx(x,y)]=1;
  [[9,2],[19,2],[3,8],[25,9],[12,19],[20,19]].forEach(([x,y],i)=>{statics.push({k:'tree',v:i%2,x,y,jx:0,jy:0});BLOCK[idx(x,y)]=1;});
  [[13,3],[16,3],[4,9],[25,12],[9,19],[16,19],[4,19]].forEach(([x,y])=>{statics.push({k:'bush',x,y,jx:0,jy:0});BLOCK[idx(x,y)]=1;});
  statics.push({k:'trough',x:TROUGH.x,y:TROUGH.y});BLOCK[idx(TROUGH.x,TROUGH.y)]=1;
  [[10,5],[19,5],[6,10],[24,5],[31,5]].forEach(([x,y])=>{lamps.push([x,y]);statics.push({k:'lamp',x,y});BLOCK[idx(x,y)]=1;});
  statics.push({k:'scare',x:SCARE.x,y:SCARE.y});BLOCK[idx(SCARE.x,SCARE.y)]=1;
}

  g.fillStyle=wet?'#3f2918':'#6e4629';rr(g,2,3,TS-4,TS-4,11);g.fill();
  g.fillStyle=wet?'#4f341f':'#80553a';rr(g,3,2,TS-6,TS-6,10);g.fill();
  for(let i=0;i<3;i++){const y=11+i*17;
    g.fillStyle=wet?'#352214':'#5e3d24';rr(g,8,y,TS-16,8,4);g.fill();
    g.fillStyle=wet?'#62432a':'#9b6c46';rr(g,8,y+8,TS-16,3,1.5);g.fill();}
  const R=rng(wet?3:4);for(let i=0;i<30;i++)circ(g,6+R()*52,6+R()*52,.9+R()*1.2,wet?'rgba(20,10,0,.4)':'rgba(170,120,80,.6)');
  if(wet)for(let i=0;i<6;i++)ell(g,10+R()*44,10+R()*44,4,1.5,'rgba(200,230,255,.18)');
  return c;
}
function buildSprites(se){
  SPR.se=se;SPR.ground=renderGround(se);
  SPR.tree=[spriteTree(se,0),spriteTree(se,1)];SPR.pine=spritePine(se);SPR.bush=spriteBush(se);
  SPR.lamp=spriteLamp();SPR.scare=spriteScare(se);SPR.house=spriteHouse(se);SPR.shop=spriteShop(se);
  SPR.coop=spriteCoop(se);SPR.stand=spriteStand(se);SPR.barn=spriteBarn(se);SPR.trough=spriteTrough(se);SPR.soil=spriteSoil(false);SPR.soilWet=spriteSoil(true);
  for(const k in cropCache)delete cropCache[k];
}

/* ================= crops ================= */
const LG='#5cb546',LD='#3f8f31',LL='#8fd66a';
function stageOf(c){const d=CROPS[c.t].days;if(c.g<=0)return 0;if(c.g>=d)return 3;return c.g<d*.45?1:2;}
const isRipe=c=>c&&!c.dead&&stageOf(c)===3;
const cropCache={};
function cropSprite(t,st,dead){
  const k=t+st+(dead?'d':'');if(cropCache[k])return cropCache[k];
  const [c,g]=mk(80,100);g.translate(40,84);drawCropShape(g,t,st,dead);cropCache[k]=c;return c;
}
function berry(g,x,y,s){g.beginPath();g.moveTo(x-6*s,y-5*s);g.quadraticCurveTo(x-6*s,y+4*s,x,y+8*s);g.quadraticCurveTo(x+6*s,y+4*s,x+6*s,y-5*s);g.quadraticCurveTo(x,y-9*s,x-6*s,y-5*s);
  g.fillStyle='#e2394a';g.fill();for(let i=0;i<5;i++)circ(g,x+(i%3-1)*3*s,y+(i<3?-1:3)*s,.9,'#ffe08a');
  leaf(g,x,y-5*s,5,2.5,-1,LD);leaf(g,x,y-5*s,5,2.5,1,LD);circ(g,x-2*s,y-2*s,1.4,'rgba(255,255,255,.6)');}
function fruit(g,x,y,r,c1,c2){circ(g,x,y,r,rgrad(g,x,y,r,[c1,c1,c2]));circ(g,x-r*.35,y-r*.35,r*.28,'rgba(255,255,255,.55)');}

      [[-9,-16,7],[7,-24,7.5],[-5,-35,6.5],[9,-40,6]].forEach(([x,y,r])=>{fruit(g,x,y,r,'#ff7a60','#c92e24');star(g,x,y-r+1,3,'#3f8f31');});break;

      ell(g,-5,-16,3,5,'rgba(255,255,255,.35)');g.fillStyle='#6b4a2a';rr(g,-2.5,-28,5,8,2);g.fill();break;
    case 'eggplant':

      for(let i=0;i<5;i++)leaf(g,0,-8-i*4,17,8,(i/4-.5)*2.4,i%2?LG:LL,'#6b4a7a');
      [[-9,-10,-.35],[9,-14,.3]].forEach(([x,y,a])=>{ell(g,x,y,5.5,10,'#5b2d7a',a);ell(g,x-1.5,y-2,1.6,4,'rgba(255,255,255,.4)',a);ell(g,x-Math.sin(a)*8,y-9,4.5,3,'#4f8a3a',a);});break;

      g.fillStyle='#f08a2b';g.beginPath();g.moveTo(-8,-5);g.quadraticCurveTo(0,-12,8,-5);g.lineTo(3,5);g.lineTo(-3,5);g.closePath();g.fill();
      line(g,-4,-3,1,-3,'#c9651a',1.3);line(g,-2,1,3,1,'#c9651a',1.3);ell(g,-3,-7,2,1.2,'rgba(255,255,255,.4)');break;

      circ(g,0,-12,13.5,rgrad(g,0,-12,13.5,['#effad8','#c8e89a','#94c86a']));
      g.strokeStyle='rgba(90,140,60,.55)';g.lineWidth=1.3;g.beginPath();g.arc(-4,-11,9,-.6,1.6);g.stroke();g.beginPath();g.arc(5,-10,8,1.6,3.8);g.stroke();
      ell(g,-4,-18,4,2.2,'rgba(255,255,255,.5)');break;

      for(let i=0;i<8;i++)leaf(g,0,-4,17+(i%3)*3,7,(i/7-.5)*2.6,i%2?LG:LL,LD);
      [[-9,-13,-.35],[8,-18,.3],[2,-7,.1]].forEach(([x,y,a])=>{g.save();g.translate(x,y);g.rotate(a);

function drawCrop(g,c,x,y,t){
  const st=c.dead?0:stageOf(c);const spr=cropSprite(c.t,st,c.dead);
  const bx=x*TS+32,by=y*TS+52;const sway=st>=1&&!c.dead?Math.sin(t*1.8+x*.7+y*.4)*.05:0;
  g.save();g.translate(bx,by);g.rotate(sway);g.drawImage(spr,-40,-84);g.restore();
  if(st===3&&!c.dead){const p=(t*.6+x*.37+y*.23)%3;if(p<.5){const a=Math.sin(p/.5*Math.PI);g.globalAlpha=a;star(g,bx+10,by-26,6*a,'#fffbe0');g.globalAlpha=1;}}
}

      circ(g,4,0,4,'#9aa3ad');circ(g,4,0,1.6,'#5f656c');

function iconCanvas(cnv,key){
  const g=cnv.getContext('2d');const s=cnv.width;g.clearRect(0,0,s,s);g.save();g.scale(s/80,s/80);
  const T={hoe:1,water:1,seed:1,sickle:1,hammer:1,milker:1,hand:1,rod:1};

    [[40,10,40,20],[40,64,40,74],[8,42,18,42],[62,42,72,42]].forEach(([a,b,c,d])=>line(g,a,b,c,d,'#8b5a2b',4));
    circ(g,40,46,11,'#f8d3ae');ell(g,40,38,17,5.5,'#e8c05a');g.fillStyle='#f6da86';g.beginPath();g.ellipse(40,35,9,7,0,Math.PI,0);g.fill();g.fillStyle='#d8443a';g.fillRect(31,33,18,3);
    circ(g,36,47,1.6,'#3a2414');circ(g,44,47,1.6,'#3a2414');g.restore();return;}
  if(key==='rod'){g.translate(34,68);g.rotate(.35);g.scale(1.3,1.3);drawToolShape(g,'rod');g.restore();return;}
  if(FISH[key]){drawFish(g,40,42,FISH[key],1.5);g.restore();return;}
  if(DISHES[key]){drawDish(g,DISHES[key]);g.restore();return;}
  if(T[key]){g.translate(40,62);g.rotate(.5);g.scale(1.7,1.7);if(key==='water'||key==='seed'||key==='milker'||key==='hand'){g.rotate(-.5);g.translate(-2,6);}drawToolShape(g,key,S&&CROPS[S.seedSel]?CROPS[S.seedSel].col:null);}
  else if(CROPS[key]){g.translate(40,70);g.scale(1.05,1.05);g.drawImage(cropSprite(key,3,false),-40,-84);}
  else if(key==='egg'||key==='eggL'){drawEgg(g,40,52,key==='eggL',1.9);}

/* ================= state ================= */
let S=null;
function newState(){
  const s={day:1,season:0,year:1,total:0,time:360,money:500,stamina:100,maxSt:100,tool:'hand',seedSel:'turnip',
    seeds:{turnip:6,potato:2},bag:{},bin:{},binTotal:0,can:{lv:20,lvl:0},weather:'sun',tomorrow:'sun',
    field:new Array(MW*MH).fill(null),chickens:[],eggs:[],px:DOOR.x,py:DOOR.y,nextChick:2,cows:[],nextCow:1,started:false};
  const R=rng(2024);
  for(let y=FIELD.y0;y<=FIELD.y1;y++)for(let x=FIELD.x0;x<=FIELD.x1;x++){if(!isFieldTile(x,y))continue;
    const safe=x<=15&&y<=12;const r=R();s.field[idx(x,y)]={til:0,wet:0,crop:null,obj:safe?null:r<.12?'weed':r<.19?'stone':null};}
  const plant=(x,y,t,g,wet)=>{const c=s.field[idx(x,y)];c.til=1;c.wet=wet?1:0;if(t)c.crop={t,g};};
  plant(10,9,'turnip',4);plant(11,9,'turnip',4);plant(12,9,'turnip',4);
  plant(13,9,'turnip',2,1);plant(14,9,'turnip',2,1);plant(10,10,'turnip',1);plant(11,10,'turnip',1);plant(12,10,'turnip',1);
  plant(13,10,null);plant(14,10,null);
  s.chickens=[mkChick(0,3.5,14.5),mkChick(1,4.6,16.2)];
  s.cows=[mkCow(0,28.5,10.5)];
  s.eggs=[{x:2,y:16,big:false}];
  return ensureVillage(s);
}
function mkCow(n,x,y){return{name:COW_NAMES[n%COW_NAMES.length],x,y,tx:x,ty:y,face:-1,timer:Math.random()*3,graze:0,moving:false,petted:false,milked:false,love:0,freeze:0,walk:0};}
// older saves were made on a 28-tile-wide map without cows
function migrate(s){
  if(!s||!s.field)return null;
  if(s.field.length===28*MH&&MW!==28){const f=new Array(MW*MH).fill(null);for(let y=0;y<MH;y++)for(let x=0;x<28;x++)f[idx(x,y)]=s.field[x+y*28];s.field=f;}
  if(s.field.length!==MW*MH)return null;
  if(!s.cows){s.cows=[mkCow(0,28.5,10.5)];s.nextCow=1;}
  return ensureVillage(s);
}
function mkChick(n,x,y){return{name:CHICK_NAMES[n%CHICK_NAMES.length],x,y,tx:x,ty:y,face:1,timer:Math.random()*2,peck:0,moving:false,petted:false,love:0,freeze:0};}
const cellAt=(x,y)=>inB(x,y)?S.field[idx(x,y)]:null;
const blocked=(x,y)=>{if(!inB(x,y))return true;if(BLOCK[idx(x,y)])return true;const c=S.field[idx(x,y)];return !!(c&&c.obj==='stone');};
function save(){try{S.px=P.tx;S.py=P.ty;localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ================= player ================= */
const P={x:DOOR.x+.5,y:DOOR.y+.5,tx:DOOR.x,ty:DOOR.y,dir:'down',path:[],walk:0,act:null,blink:0};
let queue=[],cur=null;
function findPath(sx,sy,goal){
  if(goal(sx,sy))return [];
  const prev=new Int32Array(MW*MH).fill(-1);const q=[idx(sx,sy)];prev[q[0]]=q[0];
  for(let qi=0;qi<q.length;qi++){const i=q[qi],x=i%MW,y=(i/MW)|0;
    for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const nx=x+dx,ny=y+dy;if(!inB(nx,ny))continue;const ni=idx(nx,ny);
      if(prev[ni]!==-1||blocked(nx,ny))continue;prev[ni]=i;
      if(goal(nx,ny)){const path=[];let k=ni;while(k!==q[0]){path.unshift([k%MW,(k/MW)|0]);k=prev[k];}return path;}
      q.push(ni);}}
  return null;
}
function rectDist(x,y,r){const dx=Math.max(r.x-x,0,x-(r.x+r.w-1)),dy=Math.max(r.y-y,0,y-(r.y+r.h-1));return Math.max(dx,dy);}
function goalFor(t){
  if(t.type==='walk'){if(!blocked(t.x,t.y))return(x,y)=>x===t.x&&y===t.y;return(x,y)=>Math.abs(x-t.x)+Math.abs(y-t.y)===1;}
  if(t.type==='house')return(x,y)=>x===DOOR.x&&y===DOOR.y;
  if(t.type==='shop')return(x,y)=>y===4&&x>=22&&x<=24;
  let r;if(BUILD[t.type])r=BUILD[t.type];
  else if(t.type==='cow')r={x:Math.floor(t.ref.x),y:Math.floor(t.ref.y),w:1,h:1};
  else if(t.type==='npc'){const n=NPC_RT[t.key];r=n?{x:n.tx,y:n.ty,w:1,h:1}:{x:P.tx,y:P.ty,w:1,h:1};}
  else if(t.type==='chicken')r={x:Math.floor(t.ref.x),y:Math.floor(t.ref.y),w:1,h:1};
  else r={x:t.x,y:t.y,w:1,h:1};
  return(x,y)=>rectDist(x,y,r)<=1;
}
function planPath(t){const p=findPath(P.tx,P.ty,goalFor(t));if(!p)return false;P.path=p;return true;}
function command(t){if(P.path.length)P.path=[P.path[0]];cur=null;queue=[t];}
function faceTo(x,y){const dx=x-P.tx,dy=y-P.ty;if(Math.abs(dx)>Math.abs(dy))P.dir=dx>0?'right':'left';else if(dy!==0)P.dir=dy>0?'down':'up';}

/* ================= actions ================= */
function getTileAction(x,y,tool){
  if(isWater(x,y))return tool==='water'?'refill':tool==='rod'?'fish':null;
  const c=cellAt(x,y);if(!c)return null;
  if(isRipe(c.crop))return 'harvest';
  switch(tool){
    case 'hoe':return(!c.til&&!c.obj)?'till':null;
    case 'water':return(c.til&&!c.wet)?'water':null;
    case 'seed':return(c.til&&!c.crop&&(S.seeds[S.seedSel]||0)>0)?'plant':null;
    case 'sickle':return c.obj==='weed'?'cut':(c.crop&&c.crop.dead)?'clearcrop':null;
    case 'hammer':return c.obj==='stone'?'smash':(c.til&&!c.crop)?'untill':null;
  }
  return null;
}
function hintFor(x,y){
  const c=cellAt(x,y);if(!c)return null;const tl=S.tool;
  if(tl==='hand')return null;
  if(tl==='milker')return 'ミルカーは牛をタップして使おう';
  if(tl==='rod')return 'つりざおは池をタップして使おう';
  if(c.obj==='stone'&&tl!=='hammer')return '石はハンマーでくだこう';
  if(c.obj==='weed'&&tl!=='sickle')return '雑草はカマで刈ろう';
  if(tl==='seed'){if(!(S.seeds[S.seedSel]>0))return 'タネがない！よろず屋で買おう';if(!c.til)return 'まずクワで耕そう';}
  if(tl==='water'&&!c.til)return '水やりは耕した土に';
  return null;
}
function spend(k){const cost=COST[k]||0;if(S.stamina<cost){toast('へとへとで動けない…家で休もう');queue=[];return false;}S.stamina=Math.max(0,S.stamina-cost);return true;}
function perform(t){
  const wx=(t.x+.5)*TS,wy=(t.y+.5)*TS;
  if(t.type==='tile'){
    const k=getTileAction(t.x,t.y,S.tool)||(t.kind==='harvest'&&isRipe((cellAt(t.x,t.y)||{}).crop)?'harvest':null);
    if(!k||k!==t.kind&&k!=='harvest')return;
    faceTo(t.x,t.y);
    const c=cellAt(t.x,t.y);
    if(k==='water'&&S.can.lv<=0){toast('じょうろが空っぽ！池で水をくもう');queue=queue.filter(q=>q.kind!=='water');return;}
    if(!spend(k))return;
    const tool=k==='harvest'?null:S.tool;
    P.act={tool,t:0,dur:k==='harvest'?.22:.34};
    switch(k){
      case 'till':c.til=1;dust(wx,wy+10,'#8a5a36',10);sfx('till');break;
      case 'water':S.can.lv--;c.wet=1;for(let i=0;i<12;i++)PT.push({x:wx+(Math.random()-.5)*30,y:wy-26,vx:(Math.random()-.5)*30,vy:40+Math.random()*60,g:300,life:0,max:.45,type:'drop',size:2.5,col:'#9fd4ff'});sfx('water');break;
      case 'plant':S.seeds[S.seedSel]--;c.crop={t:S.seedSel,g:0};sparkle(wx,wy,'#b7f08a',6);sfx('plant');
        if(CROPS[S.seedSel].season!==S.season){c.crop.dead=true;toast(`${CROPS[S.seedSel].name}は${SEASONS[S.season]}には育たない…`);}break;
      case 'cut':c.obj=null;leaves(wx,wy,'#5cb546',10);sfx('cut');break;
      case 'smash':c.obj=null;dust(wx,wy,'#9aa0a6',14);sfx('smash');break;
      case 'untill':c.til=0;c.wet=0;dust(wx,wy+10,'#8a5a36',6);sfx('till');break;
      case 'clearcrop':c.crop=null;leaves(wx,wy,'#a6844e',8);sfx('cut');break;
      case 'fish':startFish(wx,wy);break;
      case 'refill':S.can.lv=CAN_LV[S.can.lvl];sfx('water');toast('じょうろを満タンにした！');
        for(let i=0;i<10;i++)PT.push({x:wx+(Math.random()-.5)*20,y:wy,vx:(Math.random()-.5)*50,vy:-80-Math.random()*60,g:300,life:0,max:.6,type:'drop',size:3,col:'#bfe6ff'});break;
      case 'harvest':{const d=CROPS[c.crop.t];S.bag[c.crop.t]=(S.bag[c.crop.t]||0)+1;S.stats.harvested++;
        if(d.regrow)c.crop.g=d.days-d.regrow;else c.crop=null;
        sparkle(wx,wy-10,'#fff4b0',10);floatText(wx,wy-30,`${d.name} +1`,'#fff');sfx('harvest');bagPulse();break;}
    }
    return;
  }
  if(t.type==='chicken'){const ch=t.ref;const d=Math.hypot(ch.x-(P.tx+.5),ch.y-(P.ty+.5));if(d>1.8){if((t.tries=(t.tries||0)+1)<3){queue.unshift(t);}return;}
    faceTo(Math.floor(ch.x),Math.floor(ch.y));ch.freeze=1.2;const first=!ch.petted;ch.petted=true;
    for(let i=0;i<4;i++)PT.push({x:ch.x*TS+(Math.random()-.5)*20,y:ch.y*TS-30,vx:(Math.random()-.5)*20,vy:-40-Math.random()*20,g:0,life:0,max:1,type:'heart',size:1+Math.random()*.5,col:'#ff6b8a'});
    sfx('cluck');floatText(ch.x*TS,ch.y*TS-44,first?`${ch.name}がよろこんでいる`:`${ch.name}はごきげん`,'#ffe3ec');return;}
  if(t.type==='egg'){const e=t.ref;const i=S.eggs.indexOf(e);if(i<0)return;S.eggs.splice(i,1);const k=e.big?'eggL':'egg';S.bag[k]=(S.bag[k]||0)+1;
    faceTo(e.x,e.y);P.act={tool:null,t:0,dur:.2};sparkle(wx,wy,'#fff4b0',8);floatText(wx,wy-20,`${ITEMS[k].name} +1`,'#fff');sfx('pickup');bagPulse();return;}
  if(t.type==='bin'){faceTo(BUILD.bin.x,BUILD.bin.y);openStand();return;}
  if(t.type==='npc'){const n=NPC_RT[t.key];if(!n){toast('帰ってしまったみたい');return;}if(Math.hypot(n.x-(P.tx+.5),n.y-(P.ty+.5))>1.8){if((t.tries=(t.tries||0)+1)<4)queue.unshift(t);return;}
    faceTo(n.tx,n.ty);const dx=P.x-n.x,dy=P.y-n.y;n.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');n.freeze=6;talkTo(t.key);return;}
  if(t.type==='house'){P.dir='up';openHouse();return;}
  if(t.type==='shop'){P.dir='up';if(S.time>=480&&S.time<1080)openShop();else toast('よろず屋は 8:00〜18:00 だよ');return;}
  if(t.type==='cow'){const cw=t.ref;const d=Math.hypot(cw.x-(P.tx+.5),cw.y-(P.ty+.5));if(d>2.2){if((t.tries=(t.tries||0)+1)<3)queue.unshift(t);return;}
    faceTo(Math.floor(cw.x),Math.floor(cw.y));cw.freeze=1.8;cw.face=cw.x<P.x?1:-1;
    if(S.tool==='milker'){
      if(cw.milked){toast(`${cw.name}のミルクは今日もうしぼったよ。また明日！`);return;}
      if(!spend('milk'))return;
      cw.milked=true;const k=milkKind(cw);S.bag[k]=(S.bag[k]||0)+1;S.stats.milked++;P.act={tool:'milker',t:0,dur:.6};
      for(let i=0;i<14;i++)PT.push({x:cw.x*TS+(Math.random()-.5)*14,y:cw.y*TS-8,vx:(Math.random()-.5)*50,vy:-60-Math.random()*70,g:320,life:0,max:.6,type:'drop',size:2.6,col:'#ffffff'});
      sparkle(cw.x*TS,cw.y*TS-30,'#fff4b0',8);floatText(cw.x*TS,cw.y*TS-56,`${ITEMS[k].name} +1`,'#fff');sfx('milk');bagPulse();return;}
    const first=!cw.petted;cw.petted=true;
    for(let i=0;i<5;i++)PT.push({x:cw.x*TS+(Math.random()-.5)*30,y:cw.y*TS-50,vx:(Math.random()-.5)*20,vy:-40-Math.random()*20,g:0,life:0,max:1,type:'heart',size:1.1+Math.random()*.5,col:'#ff6b8a'});
    sfx('moo');floatText(cw.x*TS,cw.y*TS-62,first?`${cw.name}がうれしそう`:`${cw.name}はごきげん`,'#ffe3ec');

let onTitle=true,paused=true,lastHour=-1;
function update(dt,t){

  const vwW=cv.width/zoom,vhW=cv.height/zoom;
  if(onTitle){camX=clampCamX(14.5*TS+Math.sin(t*.07)*5*TS-vwW/2);camY=clampCamY(10*TS+Math.cos(t*.05)*3*TS-vhW/2);}
  else{
    const panning=ptr&&ptr.mode==='pan';
    if(camGoal&&!panning){const k=1-Math.pow(.002,dt);camX=lerp(camX,camGoal.x,k);camY=lerp(camY,camGoal.y,k);if(Math.hypot(camX-camGoal.x,camY-camGoal.y)<1)camGoal=null;}
    else if(!panning&&(camVX||camVY)){camX+=camVX*dt;camY+=camVY*dt;const f=Math.pow(.02,dt);camVX*=f;camVY*=f;if(Math.hypot(camVX,camVY)<8)camVX=camVY=0;}
    camX=clampCamX(camX);camY=clampCamY(camY);

  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life+=dt;if(p.life>=p.max){PT.splice(i,1);continue;}p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;}
  for(let i=FT.length-1;i>=0;i--){FT[i].life+=dt;if(FT[i].life>1.4)FT.splice(i,1);}
  ambient(dt,t);
  // chickens
  const night=S.time>=1200;
  for(const ch of S.chickens){
    if(ch.peck>0)ch.peck-=dt;
    if(ch.freeze>0||night||paused&&!onTitle){ch.freeze-=dt;ch.moving=false;continue;}
    ch.timer-=dt;if(ch.timer<=0){if(Math.random()<.55){ch.tx=YARD.x0+.4+Math.random()*(YARD.x1-YARD.x0+.2);ch.ty=YARD.y0+.5+Math.random()*(YARD.y1-YARD.y0+.2);}else ch.peck=.6;ch.timer=1.5+Math.random()*3;}
    const dx=ch.tx-ch.x,dy=ch.ty-ch.y,d=Math.hypot(dx,dy);
    if(d>.05){const st=Math.min(d,1.3*dt);ch.x+=dx/d*st;ch.y+=dy/d*st;if(Math.abs(dx)>.02)ch.face=dx>0?1:-1;ch.moving=true;}else ch.moving=false;
  }
  // cows
  for(const cw of S.cows){
    if(cw.graze>0)cw.graze-=dt;
    if(cw.freeze>0||night||paused&&!onTitle){cw.freeze-=dt;cw.moving=false;continue;}
    cw.timer-=dt;if(cw.timer<=0){if(Math.random()<.45){cw.tx=PASTURE.x0+.6+Math.random()*(PASTURE.x1-PASTURE.x0-.2);cw.ty=PASTURE.y0+.8+Math.random()*(PASTURE.y1-PASTURE.y0-.2);}else cw.graze=2+Math.random()*2;cw.timer=3+Math.random()*4;}
    const dx=cw.tx-cw.x,dy=cw.ty-cw.y,d=Math.hypot(dx,dy);
    if(d>.05&&cw.graze<=0){const st=Math.min(d,.55*dt);cw.x+=dx/d*st;cw.y+=dy/d*st;cw.walk+=st*9;if(Math.abs(dx)>.02)cw.face=dx>0?1:-1;cw.moving=true;}else cw.moving=false;
  }
  if(onTitle||paused)return;
  updateVillagers(dt);updateCustomers(dt);
  // time
  S.time+=dt*1.6667;
  const hr=Math.floor(S.time/60);
  if(hr!==lastHour){lastHour=hr;if(hr===18)toast('日が暮れてきた。ニワトリたちはおやすみの時間');if(hr===24)toast('もう真夜中…そろそろ寝よう');}
  if(S.time>=1560){passOut();return;}
  // player
  if(P.act){P.act.t+=dt;if(P.act.t>=P.act.dur)P.act=null;}
  else if(P.fish)updateFish(dt);
  else if(P.path.length){const [nx,ny]=P.path[0];const gx=nx+.5,gy=ny+.5;const dx=gx-P.x,dy=gy-P.y,d=Math.hypot(dx,dy);const sp=4.2*dt;
    if(Math.abs(dx)>Math.abs(dy))P.dir=dx>0?'right':'left';else if(Math.abs(dy)>.01)P.dir=dy>0?'down':'up';
    if(d<=sp){P.x=gx;P.y=gy;P.tx=nx;P.ty=ny;P.path.shift();P.walk+=d;}else{P.x+=dx/d*sp;P.y+=dy/d*sp;P.walk+=sp;}
    if(Math.floor(P.walk)!==Math.floor(P.walk-sp))sfx('step');}
  else if(cur){const t2=cur;cur=null;if(goalFor(t2)(P.tx,P.ty))perform(t2);else if((t2.tries=(t2.tries||0)+1)<3){cur=t2;if(!planPath(t2))cur=null;}}
  else if(queue.length){cur=queue.shift();if(!planPath(cur)){if(cur.type!=='tile')toast('そこには行けないみたい');cur=null;}}
}
function ambient(dt,t){
  const se=S.season,day=S.time<1140&&S.time>=390,vwW=cv.width/zoom,vhW=cv.height/zoom;
  if(S.weather==='sun'&&day&&se<2&&BF.length<4&&Math.random()<dt*.5){BF.push({x:camX+Math.random()*vwW,y:camY+Math.random()*vhW,vx:0,vy:0,t:0,life:12+Math.random()*10,col:['#ffe066','#ffffff','#ff9ec4','#9fd4ff'][Math.floor(Math.random()*4)]});}

    PT.push({x:camX+Math.random()*vwW*1.2,y:camY-10,vx:-30-Math.random()*30,vy:30+Math.random()*25,g:0,life:0,max:9,type:'petal',size:se===0?4:5,
      col:se===0?(Math.random()<.5?'#ffc4d6':'#ffe0ea'):['#e0762e','#c9472b','#f2b84b'][Math.floor(Math.random()*3)],rot:Math.random()*6,vr:(Math.random()-.5)*4});}

}

    ch.x=YARD.x0+.5+Math.random()*3;ch.y=YARD.y0+.5+Math.random()*4;ch.tx=ch.x;ch.ty=ch.y;}

}

function stepWalker(c,dt,sp){
  if(!c.path.length){c.moving=false;return true;}
  const [nx,ny]=c.path[0];const gx=nx+.5,gy=ny+.5,dx=gx-c.x,dy=gy-c.y,d=Math.hypot(dx,dy),s=sp*dt;

  if(d<=s){c.x=gx;c.y=gy;c.tx=nx;c.ty=ny;c.path.shift();c.walk+=d;}else{c.x+=dx/d*s;c.y+=dy/d*s;c.walk+=s;}

}

function questProgress(q){
  if(q.type==='stat'){const v=Math.max(0,S.stats[q.stat]-S.quests[q.id].start);return[Math.min(v,q.n),q.n];}
  const e=Object.entries(q.need);return[e.reduce((a,[k,n])=>a+Math.min(n,haveCount(k)),0),e.reduce((a,[,n])=>a+n,0)];
}
function questReady(q){const [a,b]=questProgress(q);return a>=b;}
function questHint(q){return q.type==='stat'?({sold:'直売所で合計{n}G売り上げる',harvested:'作物を{n}回収穫する',fish:'魚を{n}匹釣る',cooked:'料理を{n}品作る'})[q.stat].replace('{n}',q.n.toLocaleString()):`${needText(q.need)}をとどける`;}

let talkState=null;
function say(k,lines,choices){

function showLine(){
  const s=talkState,txt=s.lines[s.i];$('#tChoices').innerHTML='';$('#tNext').hidden=true;
  let n=0;clearInterval(s.typing);$('#tText').textContent='';
  s.typing=setInterval(()=>{n++;$('#tText').textContent=txt.slice(0,n);if(n%3===1)sfx('blip');if(n>=txt.length){clearInterval(s.typing);s.typing=null;afterLine();}},26);

function afterLine(){
  const s=talkState;if(!s)return;
  if(s.i===s.lines.length-1&&s.choices.length){const box=$('#tChoices');box.innerHTML='';
    s.choices.forEach(c=>{const b=document.createElement('button');b.className='btn '+(c.cls||'');b.textContent=c.label;b.onclick=ev=>{ev.stopPropagation();sfx('tap');endTalk();if(c.fn)c.fn();};box.appendChild(b);});}
  else $('#tNext').hidden=false;
}
function endTalk(){const s=talkState;if(s)clearInterval(s.typing);talkState=null;$('#talk').hidden=true;if(!onTitle&&$('#modal').hidden)paused=false;}
$('#talk').addEventListener('click',e=>{

});

    iconCanvas(document.querySelector('[data-tool=seed] canvas'),'seed');});
  const bagN=Object.values(S.bag).reduce((a,b)=>a+b,0);
  setIf('bag',bagN,v=>{const b=$('#bagBadge');b.hidden=!v;b.textContent=v;});
  setIf('music',musicOn,v=>$('#musicBtn').classList.toggle('off',!v));
  setIf('qready',Object.keys(S.quests).some(id=>QMAP[id]&&questReady(QMAP[id]))||!!(S.daily&&!S.daily.done&&haveCount(S.daily.k)>=S.daily.n),v=>$('#questBadge').hidden=!v);
  if(bagPulseT>0){bagPulseT-=1/60;$('#bagBtn').style.transform=`scale(${1+Math.max(0,bagPulseT)*.6})`;}else if($('#bagBtn').style.transform)$('#bagBtn').style.transform='';
}

/* ================= input ================= */
function toWorld(e){return{x:camX+e.clientX*dpr/zoom,y:camY+e.clientY*dpr/zoom};}
function pickTarget(w,quiet){
  const tx=Math.floor(w.x/TS),ty=Math.floor(w.y/TS);
  for(const k in NPC_RT){const n=NPC_RT[k];if(Math.abs(w.x-n.x*TS)<24&&w.y>n.y*TS-58&&w.y<n.y*TS+22){n.freeze=8;return{type:'npc',key:k};}}
  for(const cw of S.cows)if(Math.abs(w.x-cw.x*TS)<38&&w.y>cw.y*TS-62&&w.y<cw.y*TS+8)return{type:'cow',ref:cw};
  for(const ch of S.chickens)if(Math.hypot(w.x-ch.x*TS,w.y-(ch.y*TS-14))<30)return{type:'chicken',ref:ch};
  for(const e of S.eggs)if(e.x===tx&&e.y===ty)return{type:'egg',ref:e,x:tx,y:ty};
  const inR=(x0,y0,x1,y1)=>w.x>=x0*TS&&w.x<x1*TS&&w.y>=y0*TS&&w.y<y1*TS;
  if(inR(3,.6,7,5))return{type:'house'};
  if(inR(22,.4,25,4))return{type:'shop'};
  if(inR(6.72,3.4,8.28,5))return{type:'bin'};
  if(inR(2,9.8,5,13))return{type:'coop'};
  if(inR(27,1.4,31,6))return{type:'barn'};
  if(!inB(tx,ty))return null;
  const k=getTileAction(tx,ty,S.tool);
  if(k)return{type:'tile',x:tx,y:ty,kind:k};
  if(!quiet){const h=hintFor(tx,ty);if(h)toast(h);
    if(isWater(tx,ty))toast('じょうろで水くみ、つりざおで釣りができるよ');}
  return{type:'walk',x:tx,y:ty};
}
// one finger: tap = act, swipe = move the view, press and hold then trace = work many tiles
let ptr=null;
const HOLD_MS=350,SLOP=10;
function doTap(e){
  if(offArrow&&Math.hypot(e.clientX-offArrow.x,e.clientY-offArrow.y)<30){centerOnPlayer(false);sfx('tap');return;}
  const w=toWorld(e);const t=pickTarget(w);if(!t)return;
  tapFx={x:w.x,y:w.y,t:0};sfx('tap');command(t);
}
function startTrace(){
  const w=toWorld({clientX:ptr.sx,clientY:ptr.sy});const t=pickTarget(w,true);
  if(!t||t.type!=='tile'){ptr.mode='hold';return;}
  ptr.mode='trace';ptr.kind=t.kind;ptr.seen=new Set([t.x+','+t.y]);
  tapFx={x:w.x,y:w.y,t:0};sfx('plant');command(t);
  try{navigator.vibrate&&navigator.vibrate(15);}catch(_){}
}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(paused||onTitle)return;e.preventDefault();
  if(P.fish){reelIn();return;}
  if(ptr)return;
  ptr={id:e.pointerId,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,lt:performance.now(),mode:'pending',vx:0,vy:0};
  camVX=camVY=0;camGoal=null;
  ptr.timer=setTimeout(()=>{if(ptr&&ptr.mode==='pending')startTrace();},HOLD_MS);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr||ptr.id!==e.pointerId)return;
  const now=performance.now(),dx=e.clientX-ptr.lx,dy=e.clientY-ptr.ly,dt=Math.max(1,now-ptr.lt)/1000;
  if(ptr.mode==='trace'){
    if(paused)return;
    const w=toWorld(e);const tx=Math.floor(w.x/TS),ty=Math.floor(w.y/TS);const key=tx+','+ty;
    if(!ptr.seen.has(key)){ptr.seen.add(key);const k=getTileAction(tx,ty,S.tool);if(k&&k===ptr.kind)queue.push({type:'tile',x:tx,y:ty,kind:k});}
  }else{
    if(ptr.mode!=='pan'&&Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>SLOP){ptr.mode='pan';clearTimeout(ptr.timer);}
    if(ptr.mode==='pan'){const wx=-dx*dpr/zoom,wy=-dy*dpr/zoom;camX=clampCamX(camX+wx);camY=clampCamY(camY+wy);
      ptr.vx=lerp(ptr.vx,wx/dt,.5);ptr.vy=lerp(ptr.vy,wy/dt,.5);}
  }
  ptr.lx=e.clientX;ptr.ly=e.clientY;ptr.lt=now;
});
cv.addEventListener('pointerup',e=>{
  if(!ptr||ptr.id!==e.pointerId)return;clearTimeout(ptr.timer);
  if(ptr.mode==='pending'||ptr.mode==='hold'){if(!paused)doTap(e);}
  else if(ptr.mode==='pan'&&performance.now()-ptr.lt<80){const sp=Math.hypot(ptr.vx,ptr.vy),mx=2500/Math.max(sp,2500);camVX=ptr.vx*mx;camVY=ptr.vy*mx;}
  ptr=null;
});
cv.addEventListener('pointercancel',e=>{if(ptr&&ptr.id===e.pointerId){clearTimeout(ptr.timer);ptr=null;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!onTitle)save();});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= boot ================= */
function startGame(state,isNew){
  S=state;onTitle=false;if(!S.daily)newDaily();customers=[];
  P.x=S.px+.5;P.y=S.py+.5;P.tx=S.px;P.ty=S.py;P.path=[];P.dir='down';
  if(SPR.se!==S.season)buildSprites(S.season);
  $('#title').hidden=true;$('#hud').hidden=false;$('#toolbar').hidden=false;
  hudCache.music=null;refreshIcons();paused=false;centerOnPlayer(true);
  if(isNew){save();openHelp(true);}
  else toast(`${SEASONS[S.season]} ${S.day}日 ${wLabel(S.weather)}。おかえりなさい！`);
}
const saved=migrate(loadSave());
if(saved)$("#btnCont").hidden=false;
let confirmNew=false;
$('#btnNew').onclick=()=>{initAudio();
  if(saved&&!confirmNew){confirmNew=true;$('#btnNew').textContent='データを消してはじめる';$('#titleTip').textContent='もう一度押すと、今のセーブデータは消えます';return;}
  sfx('harvest');startGame(newState(),true);};
$('#btnCont').onclick=()=>{initAudio();sfx('harvest');startGame(saved,false);};

S=saved||newState();
buildSprites(S.season);resize();
camX=14.5*TS-cv.width/zoom/2;camY=10*TS-cv.height/zoom/2;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;gameT+=dt;
  update(dt,gameT);render(gameT,dt);if(!onTitle)updateHUD();bgmTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// fonts finished loading: redraw sprites that contain text
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>buildSprites(S.season));
})();
</script>
